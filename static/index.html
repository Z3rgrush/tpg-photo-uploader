<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TPG Photo Uploader</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="layout">

    <nav class="sidebar">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 316 316" xmlns="http://www.w3.org/2000/svg">
          <path fill="#241e20" d="M 67.57 35.91 C 126.17 36.00 184.78 36.05 243.38 35.88 C 243.25 74.42 243.40 112.97 243.31 151.51 C 228.07 123.96 212.17 96.75 197.00 69.16 C 184.06 91.87 171.22 114.65 158.35 137.40 C 155.32 142.62 152.57 148.02 149.18 153.01 C 146.13 146.78 142.42 140.91 139.14 134.80 C 130.76 148.78 123.05 163.19 114.85 177.29 C 108.60 188.79 101.81 199.98 95.71 211.55 C 95.05 211.70 93.72 212.01 93.06 212.16 C 84.61 211.42 76.06 211.93 67.57 211.89 C 67.60 153.23 67.61 94.57 67.57 35.91 Z"/>
          <path fill="#241e20" d="M 146.70 227.03 C 155.05 225.12 164.14 226.93 171.10 231.93 C 180.16 238.26 185.11 250.20 182.59 261.05 C 180.20 274.66 166.74 285.10 152.99 284.43 C 137.76 284.71 123.63 271.35 123.74 255.98 C 123.17 242.42 133.54 229.82 146.70 227.03 M 138.43 255.11 C 138.09 262.12 143.36 268.30 149.89 270.24 C 156.91 271.50 164.67 268.17 167.34 261.31 C 171.63 252.47 164.62 240.83 154.85 240.41 C 146.53 239.35 138.23 246.69 138.43 255.11 Z"/>
          <path fill="#241e20" d="M 67.51 227.32 C 83.93 227.30 100.35 227.26 116.76 227.35 C 116.81 232.02 116.72 236.70 116.79 241.37 C 110.97 241.40 105.14 241.33 99.32 241.43 C 99.49 255.47 99.29 269.51 99.41 283.55 C 94.53 283.50 89.64 283.61 84.76 283.49 C 85.02 269.47 84.77 255.44 84.88 241.41 C 79.10 241.36 73.31 241.33 67.53 241.42 C 67.61 236.72 67.63 232.02 67.51 227.32 Z"/>
          <path fill="#241e20" d="M 194.61 227.33 C 203.73 227.28 212.85 227.30 221.98 227.32 C 226.14 227.23 230.33 228.15 233.99 230.15 C 246.95 237.92 245.83 260.17 232.15 266.66 C 236.18 272.23 240.51 277.66 244.01 283.58 C 238.24 283.54 232.47 283.52 226.70 283.53 C 223.39 278.47 219.87 273.54 216.31 268.66 C 214.00 268.13 211.52 268.52 209.15 268.42 C 209.24 273.44 209.14 278.46 209.24 283.49 C 204.37 283.59 199.51 283.53 194.65 283.54 C 194.63 264.80 194.72 246.06 194.61 227.33 M 209.16 240.46 C 209.25 245.43 209.17 250.40 209.21 255.37 C 214.82 254.84 220.69 256.25 226.11 254.28 C 229.99 251.05 229.84 244.89 226.21 241.53 C 220.69 239.76 214.83 240.85 209.16 240.46 Z"/>
        </svg>
        <span>TPG Photo<br><small>Uploader</small></span>
      </div>
      <button class="nav-btn active">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z"/></svg>
        Upload Asset
      </button>
    </nav>

    <main class="content">
      <div class="page-header">
        <div>
          <h1>Upload Photo or Video</h1>
          <p class="subtitle">Upload an asset to Meta and track its filename, hash, and your internal title.</p>
        </div>
      </div>

      <!-- Upload card -->
      <div class="card upload-card">
        <div class="drop-zone" id="drop-zone">
          <div class="drop-icon" id="drop-icon">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="4" y="8" width="40" height="32" rx="3"/>
              <circle cx="17" cy="20" r="3"/>
              <path d="M4 34l10-10 7 7 6-6 11 9"/>
            </svg>
          </div>
          <div id="preview-wrap" class="hidden">
            <img id="preview-img" class="preview-img hidden" alt="preview"/>
            <div id="preview-video-label" class="preview-video-label hidden">
              <svg viewBox="0 0 24 24" fill="currentColor" width="32" height="32"><path d="M8 5v14l11-7z"/></svg>
              <span id="preview-video-name"></span>
            </div>
          </div>
          <p class="drop-label" id="drop-label">Drag &amp; drop your file here</p>
          <p class="drop-hint" id="drop-hint">JPG, PNG, GIF, MP4, MOV and more</p>
          <input type="file" id="file-input" accept="image/*,video/*" style="display:none"/>
          <button class="btn-secondary" id="btn-choose" onclick="document.getElementById('file-input').click()">Choose File</button>
        </div>

        <div class="field-group" style="margin-top:1.5rem">
          <label for="asset-title">ISBN <span class="required">*</span></label>
          <input type="text" id="asset-title" placeholder="e.g. 9780765394866"/>
        </div>
        <div class="field-group">
          <label for="asset-book-title">Title <small>optional</small></label>
          <input type="text" id="asset-book-title" placeholder="e.g. The Way of Kings"/>
        </div>

        <div class="card-actions">
          <button class="btn-primary" id="btn-upload" disabled>Upload to Meta &rarr;</button>
        </div>

        <div class="error-box hidden" id="upload-error"></div>
      </div>

      <!-- Progress -->
      <div class="card hidden" id="upload-progress">
        <div class="progress-inner">
          <div class="spinner"></div>
          <span id="progress-label">Uploading…</span>
        </div>
      </div>

      <!-- Upload log table -->
      <div id="history-section" class="hidden">
        <div class="results-header">
          <h2 class="section-title">Uploaded This Session</h2>
          <a id="sheet-link" class="btn-sheet-link" href="#" target="_blank">Open Sheet ↗</a>
        </div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="table-wrap">
            <table id="history-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Meta Filename</th>
                  <th>Hash / ID</th>
                  <th>Type</th>
                </tr>
              </thead>
              <tbody id="history-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
